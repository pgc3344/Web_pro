<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hello World</title>
	<style>
		:root{--a:#111;--b:#f2f2f2;--c:#fff}
		*{box-sizing:border-box}
		body{margin:0;background:var(--b);color:var(--a);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
		#x,#y,#z{display:flex}
		#x{min-height:100vh;align-items:center;justify-content:center}
		#y{padding:20px}
		#z{padding:18px;border:2px solid var(--a);background:var(--c)}
		.a,.b,.c,.d{display:block}
	</style>
</head>
<body>
	<div id="x"><div id="y"><div id="z"><section class="a"><div class="b"><article class="c"><header class="d"><h1 id="h">Hello</h1></header><main><span id="w">World</span></main></article></div></section></div></div></div>
	<script>
		(function(){
			var h=document.getElementById('h');
			var w=document.getElementById('w');
			var s='';
			if(h&&w){
				for(var i=0;i<2;i++) s += (i===0 ? h.textContent : ' ' + w.textContent);
				h.textContent=s;
				w.parentNode.removeChild(w);
			}
		}());
	</script>
</body>
</html>
